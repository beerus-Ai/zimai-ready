    <style>
      html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { scrollbar-width: none; }
      .text-balance { text-wrap: balance; }
      .bg-grid { background-image: linear-gradient(rgba(11,18,32,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(11,18,32,.05) 1px, transparent 1px); background-size: 32px 32px; }
      .bg-grid-dark { background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 32px 32px; }
      .shimmer-text { background: linear-gradient(90deg, #15ae7c, #ffc21a, #15ae7c); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 4s linear infinite; }
      input[type='range'] { accent-color: #0a8a5f; }
      /* Layout safety nets (zero specificity, so any utility still wins):
         grid items may shrink below their content, and decorative blobs never cause sideways scrolling. */
      :where(main) :where(.grid) > * { min-width: 0; }
      :where(main) :where(.flex) > :where(.flex-1) { min-width: 0; }
      :where(main) { overflow-x: clip; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
      /* Print: only the element marked .print-area (e.g. a certificate) */
      @media print {
        @page { size: A4 landscape; margin: 0; }
        html, body { height: 100% !important; overflow: hidden !important; background: #fff !important; }
        body * { visibility: hidden !important; }
        /* Ancestors with transforms/animations/filters become the containing block for position:fixed — neutralise them. */
        body *:has(.print-area) { animation: none !important; transform: none !important; filter: none !important; backdrop-filter: none !important; }
        .print-area, .print-area * { visibility: visible !important; }
        .print-area { position: fixed !important; inset: 0 !important; width: 100% !important; max-width: none !important; margin: 0 !important; box-shadow: none !important; transform: none !important; }
        .no-print { display: none !important; }
      }
